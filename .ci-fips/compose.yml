name: fipsci
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment: [ETCD_AUTO_COMPACTION_MODE=revision, ETCD_AUTO_COMPACTION_RETENTION=1000, ETCD_QUOTA_BACKEND_BYTES=4294967296]
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: [etcd:/etcd]
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment: {MINIO_ACCESS_KEY: minioadmin, MINIO_SECRET_KEY: minioadmin}
    command: minio server --certs-dir /certs /minio_data
    volumes: ["minio:/minio_data", "./certs:/certs:ro"]
  init:
    image: fipslocal/milvus:ci
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh","-c","chown -R milvus:milvus /var/lib/milvus"]
    volumes: [milvus:/var/lib/milvus]
  standalone:
    image: fipslocal/milvus:ci
    command: ["milvus","run","standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_USESSL: "true"
      MINIO_SSL_TLSCACERT: /certs/ca.pem
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_PASSWORDHASHALGORITHM: ${HASHALG:-bcrypt}
      COMMON_SECURITY_TLSMODE: "1"
      PROXY_HTTP_PORT: "19531"
      TLS_SERVERPEMPATH: /certs/server.pem
      TLS_SERVERKEYPATH: /certs/server.key
      TLS_CAPEMPATH: /certs/ca.pem
    volumes: ["milvus:/var/lib/milvus", "./certs:/certs:ro"]
    ports: ["127.0.0.1:19530:19530","127.0.0.1:9091:9091"]
    depends_on:
      init: {condition: service_completed_successfully}
      etcd: {condition: service_started}
      minio: {condition: service_started}
volumes: {etcd: {}, minio: {}, milvus: {}}
