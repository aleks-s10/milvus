# Fork test branch only, never proposed upstream: standalone reproduction of the FIPS-build PBKDF2
# crash (cgosymbolizer unwinding through BoringCrypto assembly) and two candidate fixes.
name: FIPS unwind repro
on:
  push:
    branches: [ci/unwind-repro]
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .ci-fips/unwind-repro
      - name: Runner CPU
        run: grep -m1 'model name' /proc/cpuinfo; nproc
      - name: Repro (original helper, 3a, 3b)
        run: docker run --rm -v $PWD/.ci-fips/unwind-repro:/r -w /r golang:1.26.9 bash /r/run.sh
