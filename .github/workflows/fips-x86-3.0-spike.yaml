# Fork spike branch only, never proposed upstream. Same as fips-x86-3.0.yaml plus patched
# folly (no libsodium) and aws-c-io (BYO_CRYPTO, no s2n) recipes, librdkafka sasl=False, s3-crt=False.
# builds the integrated FIPS 3.0 image
# (strict + OpenSSL tokenizer TLS + noembedetcd + PBKDF2 + milvus-storage without
# external table formats + nobcrypt) on x86-64, then scans and smoke-tests it.
name: FIPS x86-64 3.0 spike (no libsodium, SASL, s2n)
on:
  push:
    branches: [ci/fips-x86-3.0-spike]
env:
  MS_PIN: e5321520
  # 3 of the runner's 4 cores, so the runner agent isn't starved (an earlier run lost contact at -j4).
  JOBS: 3
  # ENABLE_GCP_NATIVE=OFF is exported inside the build container (builder.sh re-sources .env, which sets ON):
  # 3.0 lacks #51326, so gcp-native-storage misses the Conan include paths, and we deploy on Azure only.
  FLAGS: MILVUS_FIPS_ENABLED=ON MILVUS_FIPS_STRICT=ON TANTIVY_ANALYZER_REMOTE_TLS=OFF TANTIVY_ANALYZER_REMOTE_TLS_OPENSSL=ON MILVUS_NO_EMBED_ETCD=ON MILVUS_NO_BCRYPT=ON
jobs:
  # Conan dependencies in their own job, so the cache is saved even if the main build fails.
  deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: rui314/setup-mold@v1
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /extra.swap && sudo chmod 600 /extra.swap && sudo mkswap /extra.swap >/dev/null && sudo swapon /extra.swap
          df -h / ; free -h ; nproc
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cache-restore
        with:
          os: 'ubuntu22.04'
          kind: 'cpp'
      - name: Patched Conan recipes
        run: ./build/builder.sh /bin/bash .ci-fips/recipe-spike.sh
      - name: Conan dependencies
        run: |
          ./build/builder.sh /bin/bash -c "set -o pipefail; export CONAN_CPU_COUNT=$JOBS; nice -n 10 make build-3rdparty 2>&1 | tee deps.log | grep -E 'conan install failed|ERROR:' || true; test \${PIPESTATUS[0]} -eq 0"
          tail -3 deps.log
      # Keep only built packages (drops source/build trees), and make every file readable:
      # the last save failed on unreadable libiconv test files, so the build job rebuilt everything.
      - name: Shrink and fix permissions of the Conan cache
        run: |
          C=.docker/amd64-ubuntu22.04-conan2
          sudo du -sh "$C" || true
          # Run 43571972830 failed in this step without a readable log; nothing here may fail the job.
          ./build/builder.sh /bin/bash -c "conan cache clean '*'" || {
            echo "conan cache clean failed; removing source and build folders directly"
            sudo find "$C/p" -mindepth 2 -maxdepth 3 -type d \( -name s -o -name b \) -prune -exec rm -rf {} + || true
          }
          sudo chmod -R a+rX .docker || true
          sudo du -sh "$C" || true
      - uses: ./.github/actions/cache-save
        continue-on-error: true
        with:
          os: 'ubuntu22.04'
          kind: 'cpp'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deps-log
          path: deps.log
          if-no-files-found: ignore
  build:
    needs: deps
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: rui314/setup-mold@v1
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /extra.swap && sudo chmod 600 /extra.swap && sudo mkswap /extra.swap >/dev/null && sudo swapon /extra.swap
          df -h / ; free -h ; nproc
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patched milvus-storage
        run: |
          git clone -q https://github.com/milvus-io/milvus-storage.git .ci-fips/ms
          git -C .ci-fips/ms checkout -q "$MS_PIN"
          grep -q "$MS_PIN" internal/core/thirdparty/milvus-storage/CMakeLists.txt
          git -C .ci-fips/ms apply "$PWD/.ci-fips/fips-milvus-storage-3.0.patch"
          git -C .ci-fips/ms log --oneline -1; git -C .ci-fips/ms diff --stat | tail -1
      - uses: ./.github/actions/cache-restore
        with:
          os: 'ubuntu22.04'
          kind: 'cpp'
      # cache-save only warns when it fails; stop here rather than rebuild every dependency.
      - name: Patched Conan recipes
        run: ./build/builder.sh /bin/bash .ci-fips/recipe-spike.sh
      - name: Check the Conan cache was restored
        run: test -d .docker/amd64-ubuntu22.04-conan2/p || { echo "::error::Conan cache from the deps job is missing"; exit 1; }
      - name: Build
        run: |
          ./build/builder.sh /bin/bash -c "set -o pipefail; export jobs=$JOBS CONAN_CPU_COUNT=$JOBS CARGO_BUILD_JOBS=$JOBS ENABLE_GCP_NATIVE=OFF; export CMAKE_EXTRA_ARGS='-DFETCHCONTENT_SOURCE_DIR_MILVUS-STORAGE=/go/src/github.com/milvus-io/milvus/.ci-fips/ms -DWITH_EXTERNAL_TABLE_FORMATS=OFF'; nice -n 10 make install $FLAGS 2>&1 | tee build.log | grep -E 'Installation successful|FAILED:|fatal error|Error [0-9]+$' || true; test \${PIPESTATUS[0]} -eq 0"
          tail -3 build.log; grep -q 'Installation successful' build.log
          grep -m3 -E 'milvus-storage version|no-default-features' build.log | cut -c1-200 || true
      - name: Fix permissions of the caches
        if: always()
        run: sudo chmod -R a+rX .docker
      - uses: ./.github/actions/cache-save
        if: always()
        continue-on-error: true
        with:
          os: 'ubuntu22.04'
          kind: 'cpp'
      - name: Rebuild provider with gcc 11.2.0
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/r" -w /r ubuntu:jammy-20240530 bash .ci-fips/provider.sh | tee provider.log
          grep -q 'INSTALL PASSED' provider.log
          grep -q 'GCC: (Ubuntu 11.2.0-19ubuntu1) 11.2.0' provider.log
          sudo cp internal/core/output/lib/ossl-modules/fips.so lib/ossl-modules/fips.so
          sudo rm -f lib/ossl-modules/legacy.so
          sudo chown -R "$(id -u)" configs/ssl lib/ossl-modules
          ls -la lib/ossl-modules
      - name: Build image
        run: |
          df -h /
          docker build --network host --build-arg TARGETARCH=amd64 --platform linux/amd64 -f build/docker/milvus/ubuntu22.04/Dockerfile -t fipslocal/milvus:ci . > image.log 2>&1 || { tail -30 image.log; exit 1; }
          grep -E 'INSTALL PASSED' image.log || true
          docker images fipslocal/milvus:ci
          docker save fipslocal/milvus:ci | zstd -T0 -3 -o image.tar.zst; ls -la image.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.zst
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            provider.log
            image.log
          if-no-files-found: ignore
  checks:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load image
        run: zstd -dc image.tar.zst | docker load && rm image.tar.zst
      - name: In-house scan
        run: |
          mkdir -p .ci-fips/logs/scan x root/usr
          cid=$(docker create fipslocal/milvus:ci); docker cp -q $cid:/milvus x/m; docker cp -q $cid:/usr/bin root/usr/bin; docker rm $cid >/dev/null
          DV=$(grep '^DATE_VERSION=' .env | cut -d= -f2)
          docker run --rm -v $PWD/x/m:/x:ro -v $PWD/root:/x-root:ro -v $PWD/.ci-fips/logs/scan:/out -v $PWD/.ci-fips:/l:ro --entrypoint bash milvusdb/milvus-env:ubuntu22.04-$DV /l/scan-inside.sh | tee .ci-fips/logs/scan/inhouse.txt
          P=x/m/lib/libmilvus-planparser.so
          docker run --rm -v $PWD/x/m:/x:ro --entrypoint bash milvusdb/milvus-env:ubuntu22.04-$DV -c 'go version -m /x/lib/libmilvus-planparser.so | grep -E "^\s+build\s+(-tags|GOEXPERIMENT)"; go tool nm /x/lib/libmilvus-planparser.so > /tmp/n; echo "planparser: etcdserver=$(grep -c go.etcd.io/etcd/server /tmp/n) bcrypt=$(grep -c x/crypto/bcrypt /tmp/n) boring=$(grep -c crypto/internal/boring /tmp/n)"' | tee -a .ci-fips/logs/scan/inhouse.txt
          ls x/m/lib/ossl-modules | tee -a .ci-fips/logs/scan/inhouse.txt
          echo "spike libs (s2n/sodium/sasl): $(ls x/m/lib | grep -iE 's2n|sodium|sasl' | tr '\n' ' ')" | tee -a .ci-fips/logs/scan/inhouse.txt
          for f in x/m/lib/*.so*; do n=$(strings -a "$f" | grep -ciE 'sodium_init|crypto_secretbox|sasl_client_init|s2n_init'); [ "$n" = 0 ] || echo "  $(basename $f): $n"; done | tee -a .ci-fips/logs/scan/inhouse.txt
      - name: Build tokenizer test server
        run: |
          docker run --rm -v $PWD/.ci-fips/tt-server:/s -v $PWD/internal/core/thirdparty/tantivy/tantivy-binding/src/analyzer/gen:/gen:ro -e TT_GEN=/gen/milvus.proto.tokenizer.rs -w /s rust:1.85.0-bookworm cargo build --release --locked -q
          mkdir -p .ci-fips/tt-server-bin && cp .ci-fips/tt-server/target/release/tt-server .ci-fips/tt-server-bin/
      - name: Smoke test
        run: bash .ci-fips/e2e-ci.sh fipslocal/milvus:ci 2>&1 | tee .ci-fips/logs/e2e.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: .ci-fips/logs/
          if-no-files-found: ignore
